services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edusphere
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: edusphere
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusphere -d edusphere"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [redis_data:/data]
  api:
    build: ./apps/api
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  worker:
    build: ./apps/api
    command: celery -A app.worker.celery worker --loglevel=INFO
    env_file: .env
    depends_on: [api, redis]
    volumes: [uploads:/data/uploads]
  beat:
    build: ./apps/api
    command: celery -A app.worker.celery beat --loglevel=INFO
    env_file: .env
    depends_on: [api, redis]
  web:
    build:
      context: ./apps/web
      args: {BACKEND_INTERNAL_URL: http://api:8000}
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_APP_NAME: EduSphere
    depends_on: [api]
    ports: ["${WEB_PORT:-3000}:3000"]
volumes:
  postgres_data:
  redis_data:
  uploads:
